name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v3

    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract Image Tag
      id: vars
      run: |
        TAG=$(grep 'image: ' k8s.yaml | head -n 1 | awk -F ':' '{print $3}' | tr -d '[:space:]')
        echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/calculator:${{ steps.vars.outputs.IMAGE_TAG }}

    
    - name: Deploy to Kubernetes Manifest Check
      run: |
        echo "Applying deployment using image version: ${{ steps.vars.outputs.IMAGE_TAG }}"
        cat k8s.yaml
